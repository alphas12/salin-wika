# AI Amended: Provide the single configuration surface for training and translation.
device: auto

data:
  corpus_path: corpus/cebtag_105k.csv
  src_col: cebuano
  tgt_col: tagalog
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
  min_freq: 2
  max_length: 100
  lowercase: true

# 1: legacy Seq2Seq, 2: Bahdanau attention
model: 2

# Treat this as legacy, this doesn't work well
model_1:
  embedding_dim: 256
  hidden_dim: 512
  bidirectional: false
  peeky: false
  dropout: 0.3
  num_layers: 2

model_2:
  embedding_dim: 256
  encoder_dim: 512
  decoder_dim: 512
  attention_dim: 256
  dropout: 0.3

training:
  name: bahdanau
  batch_size: 64
  num_workers: 0
  pin_memory: true
  epochs: 20
  optimizer: adamw
  lr: 0.001
  patience: 5
  max_grad_norm: 1.0
  seed: 42

translation:
  model_name: bahdanau
  text: Maayong buntag.
  lowercase: true
  max_length: 100
